<!DOCTYPE html>
<html>
  <head>
    <title>Salary Prediction</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="card-title text-center mb-4">💼 Salary Prediction</h2>
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              {{ form.years_experience.label_tag }} {{ form.years_experience }}
            </div>
            <button type="submit" class="btn btn-primary w-100">Predict</button>
          </form>

          {% if prediction %}
          <div class="alert alert-success mt-4 text-center">
            <h4>Predicted Salary: ${{ prediction|floatformat:2 }}</h4>
          </div>
          {% endif %}
        </div>
      </div>
    </div>
  </body>
</html>
